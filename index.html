<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#050505"><title>Knicks Coach V2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}:root{--o:#F58426;--b:#0878bd;--g:#64dc79}html,body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-x:hidden}button,input{font:inherit}.app{max-width:430px;margin:auto;padding:4px}.top{display:grid;grid-template-columns:1fr 1.05fr 1fr;gap:4px}.score,.timer{height:82px;border:1px solid #343434;border-radius:9px;background:#0d0d0d;padding:5px;text-align:center;overflow:hidden}.score b{display:block;font-size:10px}.score input{width:100%;height:56px;border:0;background:transparent;color:#fff;font-size:40px;font-weight:1000;text-align:center;padding:0}.halves{display:grid;grid-template-columns:1fr 1fr;gap:3px}.half{height:24px;border:1px solid #444;border-radius:6px;background:#111;color:#aaa;font-weight:1000}.half.on{background:var(--o);color:#111;border-color:var(--o)}.clock{font-size:34px;font-weight:1000;line-height:1.05;font-variant-numeric:tabular-nums}.clockReset{height:20px;padding:0 9px;border:1px solid #555;border-radius:6px;background:#181818;color:#fff;font-size:8px;font-weight:900}.nav{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:4px;margin-top:4px}.nav button{height:35px;border:1px solid #444;border-radius:8px;background:#111;color:#fff;font-size:9px;font-weight:950}.nav #start{background:var(--o);border-color:var(--o);color:#111;font-size:12px}.gameMeta{border:1px solid #343434;border-radius:8px;background:#0d0d0d;padding:5px 8px;margin-top:4px;min-height:47px}.gameNum{font-size:8px;color:#aaa}.opp{font-size:16px;font-weight:1000}.meta{font-size:9px;color:#aaa;margin-top:2px}.players{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}.card{border:1px solid #555;border-radius:9px;padding:5px;min-height:101px;color:#fff}.card.on{background:linear-gradient(135deg,#087fc3,#06679f);border-color:#45b9ff}.card.off{background:linear-gradient(135deg,#ff8b22,#ef7209);border-color:#ffae64}.card.absent{background:#303030;color:#aaa;opacity:.82}.card.absent .name{font-style:italic}.nameRow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:3px;align-items:center}.name{font-size:16px;font-weight:1000;overflow:hidden;text-overflow:ellipsis}.state,.absBtn{height:24px;border-radius:6px;color:#fff;font-size:7px;font-weight:1000}.state{border:0;background:#0006;min-width:36px}.absBtn{border:1px solid #ffffff66;background:#0004;padding:0 4px}.req{font-size:7px;text-align:right;margin-top:1px}.mins{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:1px}.timeBtn{width:100%;padding:0;border:0;background:transparent;color:inherit;text-align:left;font-size:8px}.timeBtn b{font-size:13px;margin-left:2px}.bar{height:4px;background:#0005;border-radius:99px;margin-top:2px;overflow:hidden}.fill{height:100%;background:#c6eaff}.minBox.met .fill{background:var(--g)}.minBox.met b{color:#b8ffc1}.bottom{display:grid;grid-template-columns:1fr 36px 36px;gap:4px;align-items:end;margin-top:4px}.pts{font-size:21px;font-weight:1000}.pts small{font-size:7px}.pm{height:29px;border:1px solid #ffffff55;border-radius:6px;background:#111b;color:#fff;font-size:19px;font-weight:1000}.pm.plus{background:#ff921f}.absentWrap{grid-column:1/-1;border:1px solid #444;border-radius:8px;background:#111;padding:3px}.absentTitle{width:100%;height:27px;border:0;background:transparent;color:#ddd;text-align:left;font-size:10px}.absentGrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.absentGrid.hide{display:none}.footer{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}.footer button{height:35px;border:1px solid #444;border-radius:7px;background:#111;color:#fff;font-size:7px;font-weight:950;padding:2px}.footer .history{border-color:var(--o)}.modal{position:fixed;inset:0;z-index:100;background:#050505f5;display:none;overflow:auto;padding:10px}.modal.on{display:block}.box{max-width:430px;margin:auto}.modalHead{display:flex;justify-content:space-between;align-items:center}.modalHead h2{margin:4px 0 8px}.close{height:34px;background:#111;color:#fff;border:1px solid #444;border-radius:7px;font-weight:900}.adjustBox{margin-top:25%;border:1px solid #555;border-radius:12px;background:#151515;padding:12px}.adjustWho{color:#bbb}.adjustTime{font-size:44px;font-weight:1000;text-align:center}.adjustReq{text-align:center;color:#aaa;font-size:11px}.adjustBtns,.adjustActions{display:grid;gap:4px;margin-top:10px}.adjustBtns{grid-template-columns:repeat(4,1fr)}.adjustActions{grid-template-columns:1fr 1fr}.adjustBtns button,.adjustActions button,.backups button{height:40px;border:1px solid #555;border-radius:7px;background:#222;color:#fff;font-size:9px;font-weight:900}.saveAdj{background:var(--o)!important;color:#111!important}.backups{display:grid;grid-template-columns:1fr 1fr;gap:5px}.record{margin:8px 0;border:1px solid #333;border-radius:9px;padding:9px;color:#aaa}.record b{display:block;color:var(--o);font-size:30px}.seasonPts{display:grid;grid-template-columns:1fr 1fr;gap:4px}.seasonP,.histItem{border:1px solid #292929;border-radius:7px;padding:7px;background:#0b0b0b}.seasonP b{font-size:20px}.seasonP span{float:right;color:#aaa}.hist{margin-top:8px;display:grid;gap:5px}.clipCats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.clipCats button,.play{background:#111;color:#fff;border:1px solid #333;border-radius:7px}.clipCats button{height:34px;font-size:8px;font-weight:900}.plays{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.play{min-height:50px;text-align:left;padding:7px;font-size:10px;font-weight:900}.play small{display:block;color:#999}.court{margin-top:8px;aspect-ratio:1/1;background:#eef4f8;border-radius:9px;position:relative}.call{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:24px;font-weight:1000;color:#111}@media(max-height:760px){.score,.timer{height:75px}.score input{height:49px;font-size:36px}.clock{font-size:31px}.card{min-height:94px;padding:4px}.name{font-size:15px}.footer button{height:32px}}
</style></head><body><div class="app">
<div class="top"><div class="score"><b>KNICKS</b><input id="ks" type="number" min="0"></div><div class="timer"><div class="halves"><button class="half on" data-half="0">1H</button><button class="half" data-half="1">2H</button></div><div class="clock" id="clock">20:00</div><button id="resetClock" class="clockReset">↻ RESET</button></div><div class="score"><b>OPPONENT</b><input id="os" type="number" min="0"></div></div>
<div class="nav"><button id="prevGame">◀ PREV GAME</button><button id="start">START</button><button id="nextGame">NEXT GAME ▶</button></div><div class="gameMeta"><div class="gameNum" id="gameNum"></div><div class="opp" id="opp"></div><div class="meta" id="meta"></div></div><div class="players" id="players"></div><div class="footer"><button id="endGame">END GAME</button><button class="history" id="historyBtn">SEASON HISTORY</button><button id="resetGame">RESET GAME</button><button id="clipBtn">📋 CLIPBOARD</button></div></div>
<div class="modal" id="adjustModal"><div class="box"><div class="adjustBox"><div class="modalHead"><h2>Adjust Minutes</h2><button class="close" data-close="adjustModal">✕</button></div><div id="adjustWho" class="adjustWho"></div><div id="adjustTime" class="adjustTime">0:00</div><div class="adjustReq">5:00 required this half</div><div class="adjustBtns"><button data-adj="-60">−1:00</button><button data-adj="-10">−0:10</button><button data-adj="10">+0:10</button><button data-adj="60">+1:00</button></div><div class="adjustActions"><button data-close="adjustModal">CANCEL</button><button id="saveAdj" class="saveAdj">SAVE</button></div></div></div></div>
<div class="modal" id="historyModal"><div class="box"><div class="modalHead"><h2>Season History</h2><button class="close" data-close="historyModal">CLOSE</button></div><div class="backups"><button id="exportBtn">EXPORT SEASON BACKUP</button><button id="importBtn">IMPORT SEASON BACKUP</button></div><input id="file" type="file" accept=".json,application/json" hidden><div class="record">SEASON RECORD <b id="record">0–0</b></div><div class="seasonPts" id="seasonPts"></div><div class="hist" id="hist"></div></div></div>
<div class="modal" id="clipModal"><div class="box"><div class="modalHead"><h2>Clipboard</h2><button class="close" data-close="clipModal">CLOSE</button></div><div class="clipCats" id="clipCats"></div><div class="plays" id="plays"></div><div class="court"><div class="call" id="call">5-SPOT SPACING</div></div></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),P=["Zane","Jonah","Vivaan","Krew","Nhonebong","Max","Niam","Justin","Sidarth","Ethan"],S=[["Sun 9/6","12 PM","D1 White","HOME","Court 03"],["Sun 9/20","3 PM","Collinsville Pirates","HOME","Court 01"],["Sun 9/27","12 PM","Collinsville Pirates","AWAY","Court 01"],["Sun 10/4","12 PM","Prosper Elite","AWAY","Court 03"],["Sat 10/17","3 PM","One J Blue","HOME","Court 03"],["Sat 10/24","9 AM","Wolfpack","HOME","Court 03"],["Sat 10/31","3 PM","D1 White","AWAY","Court 03"],["Sun 11/8","1 PM","Jags","AWAY","Court 04"]],K="knicks_v2_live",H="knicks_v2_history";
const fresh=g=>({g,half:0,rem:[1200,1200],r:false,last:null,ks:0,os:0,status:Object.fromEntries(P.map(n=>[n,"off"])),played:Object.fromEntries(P.map(n=>[n,[0,0]])),pts:Object.fromEntries(P.map(n=>[n,0]))}),load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},fmt=s=>`${Math.floor(Math.max(0,s)/60)}:${String(Math.floor(Math.max(0,s)%60)).padStart(2,"0")}`;let hist=Array.isArray(load(H))?load(H):[],st=load(K)||fresh(3),absOpen=false,adj=null;P.forEach(n=>{st.status[n]??="off";st.played[n]??=[0,0];st.pts[n]??=0});function save(){localStorage.setItem(K,JSON.stringify({...st,r:false,last:null}));localStorage.setItem(H,JSON.stringify(hist))}
function norm(g){let played=Object.fromEntries(P.map(n=>[n,[0,0]]));P.forEach(n=>{let x=g?.played?.[n];if(Array.isArray(x))played[n]=x.length>=4?[+(x[0]||0)+ +(x[1]||0),+(x[2]||0)+ +(x[3]||0)]:[+(x[0]||0),+(x[1]||0)]});return{g:+(g?.g||0),opp:g?.opp||S[+(g?.g||0)]?.[2]||"Opponent",date:g?.date||S[+(g?.g||0)]?.[0]||"Game",ks:+(g?.ks||0),os:+(g?.os||0),pts:Object.fromEntries(P.map(n=>[n,+(g?.pts?.[n]||0)])),played}}
function card(n){let p=st.played[n],s=st.status[n],m0=p[0]>=300,m1=p[1]>=300;return `<div class="card ${s}" data-card="${n}"><div class="nameRow"><div class="name">${n}</div><button class="state" data-toggle="${n}">${s==="on"?"IN":s==="absent"?"ABS":"OUT"}</button><button class="absBtn" data-abs="${n}">${s==="absent"?"RETURN":"ABSENT"}</button></div><div class="req">MIN 5:00 / HALF</div><div class="mins"><div class="minBox ${m0?"met":""}"><button class="timeBtn" data-time="${n}" data-h="0">1H <b>${fmt(p[0])}</b></button><div class="bar"><div class="fill" style="width:${Math.min(100,p[0]/3)}%"></div></div></div><div class="minBox ${m1?"met":""}"><button class="timeBtn" data-time="${n}" data-h="1">2H <b>${fmt(p[1])}</b></button><div class="bar"><div class="fill" style="width:${Math.min(100,p[1]/3)}%"></div></div></div></div><div class="bottom"><div class="pts">${st.pts[n]} <small>PTS</small></div><button class="pm" data-minus="${n}">−</button><button class="pm plus" data-plus="${n}">+</button></div></div>`}
function bind(){document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=e=>{e.stopPropagation();let n=b.dataset.toggle;if(st.status[n]!=="absent")st.status[n]=st.status[n]==="on"?"off":"on";render();save()});document.querySelectorAll("[data-card]").forEach(c=>c.onclick=e=>{if(e.target.closest("button"))return;let n=c.dataset.card;if(st.status[n]!=="absent"){st.status[n]=st.status[n]==="on"?"off":"on";render();save()}});document.querySelectorAll("[data-abs]").forEach(b=>b.onclick=e=>{e.stopPropagation();let n=b.dataset.abs;st.status[n]=st.status[n]==="absent"?"off":"absent";render();save()});document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=e=>{e.stopPropagation();st.pts[b.dataset.plus]++;render();save()});document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=e=>{e.stopPropagation();let n=b.dataset.minus;st.pts[n]=Math.max(0,st.pts[n]-1);render();save()});document.querySelectorAll("[data-time]").forEach(b=>b.onclick=e=>{e.stopPropagation();let n=b.dataset.time,h=+b.dataset.h;adj={n,h,val:st.played[n][h]};$("adjustWho").textContent=`${n} — ${h?"2nd":"1st"} Half`;$("adjustTime").textContent=fmt(adj.val);$("adjustModal").classList.add("on")})}
function render(){let g=S[st.g]||S[0];$("gameNum").textContent=`Game ${st.g+1} of ${S.length}`;$("opp").textContent=g[2];$("meta").textContent=`${g[0]} · ${g[1]} · ${g[3]} · ${g[4]}`;$("clock").textContent=fmt(st.rem[st.half]);$("ks").value=st.ks;$("os").value=st.os;$("start").textContent=st.r?"PAUSE":"START";document.querySelectorAll(".half").forEach(b=>b.classList.toggle("on",+b.dataset.half===st.half));let a=P.filter(n=>st.status[n]!=="absent"),z=P.filter(n=>st.status[n]==="absent");$("players").innerHTML=a.map(card).join("")+(z.length?`<div class="absentWrap"><button class="absentTitle" id="absToggle">Absent Players (${z.length}) ${absOpen?"▲":"▼"}</button><div class="absentGrid ${absOpen?"":"hide"}">${z.map(card).join("")}</div></div>`:"");if($("absToggle"))$("absToggle").onclick=()=>{absOpen=!absOpen;render()};bind()}
function tick(){if(!st.r)return;let now=Date.now(),e=Math.floor((now-st.last)/1000);if(e<1)return;let d=Math.min(e,st.rem[st.half]);st.rem[st.half]-=d;P.forEach(n=>{if(st.status[n]==="on")st.played[n][st.half]+=d});st.last+=d*1000;if(st.rem[st.half]<=0)st.r=false;render();save()}setInterval(tick,250);
$("start").onclick=()=>{st.r=!st.r;st.last=st.r?Date.now():null;render();save()};document.querySelectorAll(".half").forEach(b=>b.onclick=()=>{st.r=false;st.half=+b.dataset.half;render();save()});$("resetClock").onclick=()=>{if(confirm(`Reset ${st.half?"2H":"1H"} clock to 20:00? Player minutes stay recorded.`)){st.r=false;st.rem[st.half]=1200;render();save()}};$("ks").oninput=e=>{st.ks=Math.max(0,+e.target.value||0);save()};$("os").oninput=e=>{st.os=Math.max(0,+e.target.value||0);save()};$("prevGame").onclick=()=>{if(st.g>0&&confirm("Go to previous game? Unsaved current-game changes will reset.")){st=fresh(st.g-1);render();save()}};$("nextGame").onclick=()=>{if(st.g<S.length-1&&confirm("Go to next game? Unsaved current-game changes will reset.")){st=fresh(st.g+1);render();save()}};
document.querySelectorAll("[data-adj]").forEach(b=>b.onclick=()=>{if(adj){adj.val=Math.max(0,Math.min(1200,adj.val+(+b.dataset.adj)));$("adjustTime").textContent=fmt(adj.val)}});$("saveAdj").onclick=()=>{if(adj){st.played[adj.n][adj.h]=adj.val;save();render();$("adjustModal").classList.remove("on");adj=null}};document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove("on"));
$("resetGame").onclick=()=>{if(confirm("Reset CURRENT game? Saved season history stays.")){st=fresh(st.g);render();save()}};$("endGame").onclick=()=>{st.r=false;let g=S[st.g];if(!confirm(`END GAME?\n${g[0]} vs ${g[2]}\nFinal: Knicks ${st.ks}-${st.os}`))return;let done={g:st.g,opp:g[2],date:g[0],ks:st.ks,os:st.os,pts:{...st.pts},played:JSON.parse(JSON.stringify(st.played))},i=hist.findIndex(x=>+x.g===st.g);i>=0?hist[i]=done:hist.push(done);hist.sort((a,b)=>a.g-b.g);save();if(st.g<S.length-1)st=fresh(st.g+1);render();save()};
function sp(){let o=Object.fromEntries(P.map(n=>[n,0]));hist.forEach(g=>P.forEach(n=>o[n]+=+(g.pts?.[n]||0)));return o}function rec(){let w=0,l=0;hist.forEach(g=>{if(g.ks>g.os)w++;else if(g.ks<g.os)l++});return `${w}–${l}`}function rh(){$("record").textContent=rec();let x=sp();$("seasonPts").innerHTML=P.map(n=>`<div class="seasonP"><b>${x[n]}</b><span>${n}</span></div>`).join("");$("hist").innerHTML=hist.length?hist.map(g=>`<div class="histItem"><b>${g.date} vs ${g.opp}</b>${g.ks>g.os?"WIN":g.ks<g.os?"LOSS":"TIE"} · Knicks ${g.ks}-${g.os}</div>`).join(""):`<div class="histItem">No completed games saved yet.</div>`}$("historyBtn").onclick=()=>{rh();$("historyModal").classList.add("on")};$("exportBtn").onclick=()=>{let payload={app:"Knicks Season Tracker",version:2,exportedAt:new Date().toISOString(),history:hist,live:{...st,r:false,last:null}},blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`knicks-v2-season-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$("importBtn").onclick=()=>$("file").click();$("file").onchange=e=>{let f=e.target.files?.[0];if(!f)return,r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.history))throw 0;if(!confirm(`Import ${d.history.length} completed game(s)?`))return;hist=d.history.map(norm);save();rh();render();alert("Season backup imported.")}catch{alert("That file is not a valid Knicks season backup.")}e.target.value=""};r.readAsText(f)};
const PLAY={"OFFENSE":[["5-SPOT SPACING","1 top · 2 wings · 2 bigs"],["PASS → CUT → FILL","Pass, cut hard, fill open space"],["GIVE & GO","Pass · cut · return pass"]],"DEFENSE":[["2-1-2 ZONE","2 up · 1 middle · 2 low"],["ZONE SLIDE","Five move together with the ball"],["DOUBLE-TEAM","Two to ball · others protect gaps"]],"TRANSITION":[["REBOUND → OUTLET","Rebound · chin it · short outlet"],["3-LANE BREAK","Left · middle · right"],["2-ON-1","Attack middle · make defender choose"]],"BLANK":[["BLANK COURT","Draw / explain anything"]]};let cats=Object.keys(PLAY);$("clipCats").innerHTML=cats.map((c,i)=>`<button class="${i?"":"on"}" data-cat="${c}">${c}</button>`).join("");function setCat(c){document.querySelectorAll("[data-cat]").forEach(b=>b.classList.toggle("on",b.dataset.cat===c));$("plays").innerHTML=PLAY[c].map(p=>`<button class="play" data-call="${p[0]}">${p[0]}<small>${p[1]}</small></button>`).join("");document.querySelectorAll("[data-call]").forEach(b=>b.onclick=()=>$("call").textContent=b.dataset.call);$("call").textContent=PLAY[c][0][0]}document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>setCat(b.dataset.cat));setCat("OFFENSE");$("clipBtn").onclick=()=>$("clipModal").classList.add("on");render();save()})();
</script></body></html>
